name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "Abstract/**"
  workflow_call:
    inputs:
      formula:
        required: false
        type: string
      sanitizers:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      formula:
        required: false
        type: string
      sanitizers:
        description: "Also build ASan+UBSan variants of Ruby 3.4+ (macOS and glibc Linux only)"
        required: false
        type: boolean
        default: false

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    # rv-ruby-dev was a mirror of this repo, and must not release anything of its own
    if: ${{ github.event_name != 'push' || github.repository == 'spinel-coop/rv-ruby' }}
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.setup.outputs.formulas }}
      sanitizer_formulas: ${{ steps.setup.outputs.sanitizer_formulas }}
      date: ${{ steps.setup.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: date
      - run: date +%Y%m%d
      - id: setup
        env:
          FORMULA_FILTER: ${{ inputs.formula }}
          BEFORE: ${{ github.event.before }}
        run: |
          list=$(ls Formula/rv-ruby* | jq --raw-input | jq --slurp --compact-output 'map(. |= .[8:-3])')
          if [[ -n "$FORMULA_FILTER" ]]; then
            # if we passed a string, only build matches
            list=$(echo "$list" | jq --compact-output --arg f "$FORMULA_FILTER" 'map(select(. | contains($f)))')
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -z "$(git diff --name-only "$BEFORE..$GITHUB_SHA" -- Abstract 'Formula/rv-portable-*')" ]]; then
            # a push that only edits rubies builds just those
            list=$(bin/edited-formulas "$BEFORE..$GITHUB_SHA")
          else
            # an abstract or a portable library changes every ruby, so build all but rv-ruby-dev
            list=${list/'"'rv-ruby-dev'"',/}
          fi
          echo 'setting $formulas to:'
          echo "$list"
          echo formulas=$list >> "$GITHUB_OUTPUT"
          # Sanitizer builds need Ruby 3.4+ (the RvRuby34 and RvRuby abstract formulae)
          sanitizer_list=$(grep -lE '< RvRuby(34)?$' Formula/rv-ruby* | jq --raw-input | jq --slurp --compact-output --argjson list "$list" 'map(.[8:-3]) | map(select(. as $f | $list | index($f)))')
          echo 'setting $sanitizer_formulas to:'
          echo "$sanitizer_list"
          echo sanitizer_formulas=$sanitizer_list >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build-homebrew:
    needs: setup
    if: ${{ needs.setup.outputs.formulas != '[]' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.setup.outputs.formulas) }}
    uses: $/.github/workflows/build.yml
    with:
      formula: ${{ matrix.formula }}

  build-sanitizers:
    needs: setup
    if: ${{ inputs.sanitizers && needs.setup.outputs.sanitizer_formulas != '[]' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.setup.outputs.sanitizer_formulas) }}
    uses: $/.github/workflows/build.yml
    with:
      formula: ${{ matrix.formula }}
      sanitizers: true

  build-alpine:
    needs: setup
    if: ${{ needs.setup.outputs.formulas != '[]' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.setup.outputs.formulas) }}
    uses: $/.github/workflows/build-alpine.yml
    with:
      formula: ${{ matrix.formula }}

  release:
    needs: [setup, build-homebrew, build-alpine, build-sanitizers]
    # build-sanitizers is skipped unless requested
    if: ${{ !failure() && !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.formulas != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BUCKET: rv-ruby
      AWS_REGION: ${{ vars.RV_RUBY_REGION }}
      AWS_ENDPOINT_URL: https://${{ vars.RV_RUBY_REGION }}.object.fastlystorage.app
      # Fastly Object Storage doesn't take the checksums newer versions of the AWS CLI send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap ${{ github.repository }} .
          brew trust ${{ github.repository }}

      - name: Checkout branch
        run: git checkout "${GITHUB_REF_NAME}"

      - name: Install gems
        run: brew install-bundler-gems --groups=pr_upload

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@main

      - name: Setup directory
        run: mkdir rubies

      - name: Download rubies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rv-ruby*
          path: rubies
          merge-multiple: true

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"

      - name: Pick a build id
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RV_RUBY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RV_RUBY_SECRET_ACCESS_KEY }}
          DATE: ${{ needs.setup.outputs.date }}
        run: |
          build=$(tools/publish build --bucket="$BUCKET" --date="$DATE" rubies)
          echo "BUILD=$build" >> "$GITHUB_ENV"

      # GitHub Packages tags each image with this version, and won't replace one that exists
      - name: Set bottle versions to the build id
        working-directory: rubies
        run: |
          for json in ruby-*.json; do
            jq --arg build "$BUILD" 'map_values(.formula.pkg_version = $build)' "$json" > "$json.tmp"
            mv "$json.tmp" "$json"
          done

      - name: Generate SHA256 checksums
        working-directory: rubies
        run: |
          shopt -s nullglob
          files=(*.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No tarballs found in rubies/" >&2
            exit 1
          fi
          shasum -a 256 -- "${files[@]}" > SHA256SUMS

      - name: Upload to GitHub Packages
        working-directory: rubies
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: brew rv-upload --debug --root-url="https://ghcr.io/v2/${GITHUB_REPOSITORY,,}"

      - name: Upload rubies to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RV_RUBY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RV_RUBY_SECRET_ACCESS_KEY }}
        run: |
          tools/publish upload --bucket="$BUCKET" --build="$BUILD" rubies
          aws s3 cp rubies/SHA256SUMS "s3://$BUCKET/runs/$GITHUB_RUN_ID/SHA256SUMS" --only-show-errors --content-type text/plain

      - name: Generate the index
        id: index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RV_RUBY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RV_RUBY_SECRET_ACCESS_KEY }}
        run: |
          surrogate_keys=$(tools/index --bucket="$BUCKET" --out=index)
          echo "surrogate_keys=$surrogate_keys" >> "$GITHUB_OUTPUT"
          pipx run check-jsonschema==0.39.0 --schemafile tools/schema/index.json index/v1/index.json
          pipx run check-jsonschema==0.39.0 --schemafile tools/schema/alias.json index/alias/*/*.json

      # The rubies are already up, so a failure before this step leaves the old index in place
      - name: Upload the index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RV_RUBY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RV_RUBY_SECRET_ACCESS_KEY }}
        run: |
          # keep the index we are replacing, so it can be put back by hand. There is none the first time.
          aws s3 cp "s3://$BUCKET/v1/index.json" index/v1/index.json.prev --only-show-errors || true
          aws s3 cp index "s3://$BUCKET" --recursive --only-show-errors --exclude v1/SHA256SUMS --content-type application/json
          aws s3 cp index/v1/SHA256SUMS "s3://$BUCKET/v1/SHA256SUMS" --only-show-errors --content-type text/plain

      - name: Purge the index and the alias maps that changed
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
          FASTLY_SERVICE_ID: ${{ vars.FASTLY_SERVICE_ID }}
          SURROGATE_KEYS: ${{ steps.index.outputs.surrogate_keys }}
        run: |
          # Fastly takes up to 256 keys in a request
          echo "$SURROGATE_KEYS" | jq --raw-output 'range(0; length; 256) as $i | .[$i:$i + 256] | join(" ")' | while read -r keys; do
            curl --fail --silent --show-error --request POST \
              --header "Fastly-Key: $FASTLY_API_TOKEN" --header "Surrogate-Key: $keys" \
              "https://api.fastly.com/service/$FASTLY_SERVICE_ID/purge"
          done

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RV_BOT_PRIVATE_KEY }}
          permission-contents: write

      # Versions of rv from before rv.dev/ruby install from the latest GitHub release.
      # This one release holds every ruby, and is only ever added to.
      - name: Add rubies to the rubies release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          shopt -s nullglob
          files=(rubies/ruby-[0-9]*.tar.gz)
          if (( ${#files[@]} > 0 )); then
            # this release keeps the names the tarballs were built with, which those versions of rv ask for
            tools/publish release-sums index/v1/SHA256SUMS > SHA256SUMS
            gh release upload rubies "${files[@]}" SHA256SUMS --clobber
          fi

      # A newer release would become the latest one, and those versions of rv would stop seeing most rubies
      - name: Check that rubies is the newest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ "$newest" != "rubies" ]]; then
            echo "::error::$newest was created after the rubies release. Delete it, or rv installs from GitHub will break."
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: dev-app-token
        if: ${{ hashFiles('rubies/ruby-dev.*.tar.gz') != '' }}
        with:
          client-id: ${{ secrets.RV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RV_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rv-ruby-dev
          permission-contents: write

      # Those versions of rv install dev from the latest release of rv-ruby-dev, which stays where it is
      - name: Add ruby-dev to the rv-ruby-dev release
        if: ${{ hashFiles('rubies/ruby-dev.*.tar.gz') != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.dev-app-token.outputs.token }}
          DEV_REPOSITORY: ${{ github.repository_owner }}/rv-ruby-dev
        run: |
          tag=$(gh release view --repo "$DEV_REPOSITORY" --json tagName --jq .tagName)
          gh release upload "$tag" rubies/ruby-dev.*.tar.gz --repo "$DEV_REPOSITORY" --clobber

      - name: Generate release artifact provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: rubies/SHA256SUMS

      - name: Cleanup
        run: rm -rvf rubies

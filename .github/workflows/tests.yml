name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - run: brew test-bot --only-tap-syntax

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
      - run: test/rv-bump-test
      - run: bin/rv-bump write --dry-run --index=test/fixture/index.txt
      - run: test/index-test
      - run: test/publish-test
      - run: test/mirror-test

  list_edited_formulas:
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.list.outputs.formulas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          list='[]'
          # pushes to main have no base, and nothing to build
          if [[ -n "$BASE" ]]; then
            list=$(bin/edited-formulas "$BASE...$HEAD")
          fi
          echo "edited formulas: $list"
          echo "formulas=$list" >> "$GITHUB_OUTPUT"

  build_edited_formulas:
    needs: list_edited_formulas
    if: ${{ needs.list_edited_formulas.outputs.formulas != '[]' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.list_edited_formulas.outputs.formulas) }}
    uses: $/.github/workflows/build.yml
    with:
      formula: ${{ matrix.formula }}

  build_edited_formulas_alpine:
    needs: list_edited_formulas
    if: ${{ needs.list_edited_formulas.outputs.formulas != '[]' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.list_edited_formulas.outputs.formulas) }}
    uses: $/.github/workflows/build-alpine.yml
    with:
      formula: ${{ matrix.formula }}

  # This job is used as a required status check, instead of requiring each build matrix element.
  # The names of those change with the formula being built, so they cannot be set as required.
  build-edited-formulas:
    needs: [list_edited_formulas, build_edited_formulas, build_edited_formulas_alpine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [[ ! "$RESULTS" =~ failure|cancelled ]]

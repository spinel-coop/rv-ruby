name: Daily ruby-dev

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

jobs:
  daily:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: ${{ github.repository == 'spinel-coop/rv-ruby' }}
    uses: $/.github/workflows/release.yml
    with:
      formula: rv-ruby-dev
      sanitizers: true

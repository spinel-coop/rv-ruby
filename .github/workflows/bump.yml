name: Bump rubies

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only bump this version (e.g., 4.1.0-preview1)"
        required: false
        type: string
      dry_run:
        description: "List the new versions without opening pull requests"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  bump:
    if: ${{ github.repository == 'spinel-coop/rv-ruby' }}
    runs-on: ubuntu-latest
    steps:
      # Pull requests opened with the default token don't trigger CI, so there would be nothing to merge on.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RV_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"

      - name: Find new rubies
        id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [[ -n "$ONLY" ]]; then
            args+=("--only=$ONLY")
          fi
          bumps=$(bin/rv-bump list "${args[@]}")
          echo "$bumps" | jq .
          echo "versions=$(echo "$bumps" | jq --raw-output 'map(.version) | join(" ")')" >> "$GITHUB_OUTPUT"

      - name: Configure Git user
        if: ${{ !inputs.dry_run && steps.list.outputs.versions != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Open pull requests
        if: ${{ !inputs.dry_run && steps.list.outputs.versions != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSIONS: ${{ steps.list.outputs.versions }}
        run: |
          for version in $VERSIONS; do
            branch="bump/ruby-$version"

            # A pull request that is still open is waiting on a fix, and a closed one was turned down.
            if [[ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]]; then
              echo "A pull request for $version already exists, skipping."
              continue
            fi

            git switch --force-create "$branch" "$GITHUB_SHA"
            bin/rv-bump write --only="$version"
            git add Formula
            git commit --message "add ruby $version"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$branch"

            gh pr create --head "$branch" --title "ruby $version" \
              --body "ruby-lang.org published Ruby $version. This formula was written by \`bin/rv-bump\`."
            gh pr merge "$branch" --auto --merge
          done
